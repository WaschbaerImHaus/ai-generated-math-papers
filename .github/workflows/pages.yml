# GitHub Pages Deployment Workflow
# Baut die Jekyll-Site aus docs/ und veröffentlicht sie automatisch
# Autor: Michael Fuhrmann
# Letzte Änderung: 2026-03-28

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - "README.md"

  # Manueller Trigger
  workflow_dispatch:

# Berechtigungen für GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Nur einen gleichzeitigen Deployment-Prozess erlauben
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job 1: Jekyll-Site bauen
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Ruby und Jekyll einrichten
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs

      - name: GitHub Pages konfigurieren
        id: pages
        uses: actions/configure-pages@v5

      - name: Jekyll-Site bauen
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        working-directory: docs
        env:
          JEKYLL_ENV: production

      - name: Build-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs/_site"

  # Job 2: Site deployen
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
