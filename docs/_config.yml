title: "specialist-maths"
description: "AI-Generated Mathematical Research — 97 Papers, 10,403+ Tests, Millennium Problems"
author: "Michael Fuhrmann"

# GitHub Pages Theme (direkt unterstützt, kein Plugin nötig)
theme: jekyll-theme-cayman

# Site-URLs
baseurl: "/ai-generated-math-papers"
url: "https://waschbaerimhaus.github.io"
repository: WaschbaerImHaus/ai-generated-math-papers

# Navigation (Cayman zeigt diese Seiten im Header)
header_pages:
  - papers.md
  - modules.md
  - changelog.md
  - download.md

# Markdown
markdown: kramdown
kramdown:
  input: GFM

# Syntax-Highlighting
highlighter: rouge

# Vom Build ausschließen
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - "*.sh"
